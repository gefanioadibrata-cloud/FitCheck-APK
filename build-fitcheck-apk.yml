name: Build FitCheck APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FitCheckAndroid_Project.zip'
      - '.github/workflows/build-fitcheck-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract FitCheck project
        run: |
          unzip -o FitCheckAndroid_Project.zip -d .
          test -f FitCheckAndroid/app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: FitCheckAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitCheck-debug-apk
          path: FitCheckAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
